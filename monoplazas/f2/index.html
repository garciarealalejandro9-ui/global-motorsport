<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIA Formula 2 - Resultados y Campeonatos</title>
    <!-- Estilos generales coherentes con tu web de F1 -->
    <style>
        :root {
            --f2-primary: #000000;
            --f2-accent: #00d2be; /* Tono distintivo para F2 */
            --f2-red: #ff1801;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--f2-primary);
            border-bottom: 3px solid var(--f2-red);
            padding: 1.5rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--f2-red);
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Selector de Temporadas (2017 - 2027) */
        .season-selector {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            scrollbar-width: thin;
        }

        .season-btn {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid #333;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .season-btn:hover, .season-btn.active {
            background-color: var(--f2-red);
            color: var(--text-color);
            border-color: var(--f2-red);
        }

        /* Tabla de Resultados */
        .table-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid #2c2c2c;
        }

        th {
            background-color: #252525;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #262626;
        }

        .pos-col {
            font-weight: bold;
            text-align: center;
            width: 60px;
        }

        .pos-1 { color: #ffd700; }
        .pos-2 { color: #c0c0c0; }
        .pos-3 { color: #cd7f32; }

        .info-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 3rem;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>FIA <span>Formula 2</span> Hub</h1>
        <p style="color: #888; margin: 0.5rem 0 0 0;">Resultados, Clasificaciones y Temporadas (2017 - 2027)</p>
    </header>

    <div class="container">
        <!-- Selector de Temporadas -->
        <div class="season-selector" id="seasonSelector">
            <!-- Se generan dinámicamente o de forma estática -->
        </div>

        <!-- Contenedor de la Tabla -->
        <div class="table-container">
            <div id="tableContent">
                <div class="info-message">Selecciona una temporada para cargar los datos oficiales.</div>
            </div>
        </div>
    </div>

    <script>
        // Generar los botones de temporada de 2017 a 2027
        const seasonsContainer = document.getElementById('seasonSelector');
        const currentYear = 2026; // Año actual de referencia

        for (let year = 2027; year >= 2017; year--) {
            const btn = document.createElement('button');
            btn.className = `season-btn ${year === currentYear ? 'active' : ''}`;
            btn.innerText = year;
            btn.onclick = () => cargarTemporada(year);
            seasonsContainer.appendChild(btn);
        }

        function cargarTemporada(year) {
            // Actualizar clases activas en los botones
            document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const container = document.getElementById('tableContent');
            container.innerHTML = `<div class="info-message">Cargando resultados de la temporada ${year}...</div>`;

            // Aquí es donde leeremos el archivo JSON automático que generará el scraper
            fetch(`data/f2_${year}.json`)
                .then(response => {
                    if (!response.ok) throw new Error("Datos no disponibles temporalmente");
                    return response.json();
                })
                .then(data => {
                    renderTable(data);
                })
                .catch(error => {
                    // Mensaje limpio si el archivo de esa temporada aún no se ha generado o está vacío
                    container.innerHTML = `
                        <div class="info-message">
                            <h3>Temporada ${year}</h3>
                            <p>Los datos automáticos para este año se actualizarán próximamente mediante el sistema de extracción.</p>
                        </div>`;
                });
        }

        function renderTable(data) {
            const container = document.getElementById('tableContent');
            if (!data || data.length === 0) {
                container.innerHTML = `<div class="info-message">No hay registros para mostrar en esta temporada todavía.</div>`;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th class="pos-col">Pos</th>
                            <th>Piloto</th>
                            <th>Equipo</th>
                            <th>Puntos</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(row => {
                html += `
                    <tr>
                        <td class="pos-col pos-${row.pos}">${row.pos}</td>
                        <td><strong>${row.driver}</strong></td>
                        <td>${row.team}</td>
                        <td>${row.points}</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // Cargar por defecto el año actual al entrar
        // (Opcional: puedes disparar el fetch del año actual aquí)
    </script>
</body>
</html>
