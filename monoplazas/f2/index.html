<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula 2 - Live Timing & Hub</title>
    <style>
        :root {
            --f2-blue: #0055ff;
            --f2-glow: rgba(0, 85, 255, 0.4);
            --bg-deep: #050505;
            --bg-panel: #111113;
            --bg-card: #18181b;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --live-green: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--f2-blue); 
            padding-bottom: 16px; 
            margin-bottom: 24px; 
        }
        .brand { font-size: 20px; font-weight: 900; text-transform: uppercase; }
        .brand span { color: var(--f2-blue); }
        
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--live-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--live-green);
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--live-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--live-green);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px var(--live-green); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .panel-title {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 16px;
            border-left: 4px solid var(--f2-blue);
            padding-left: 10px;
        }
        .timing-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .timing-table th, .timing-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .timing-table th {
            background: var(--bg-deep);
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
        }
        .timing-table tr:hover td { background: var(--bg-card); }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">Fórmula 2 <span>Live Timing Hub</span></div>
        <div class="live-indicator">
            <div class="pulse-dot"></div>
            EN DIRECTO (Sincronizando)
        </div>
    </div>

    <div class="panel">
        <h2 class="panel-title">Clasificación en Tiempo Real (Sesión Activa)</h2>
        <div id="liveContainer">
            <table class="timing-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Piloto</th>
                        <th>Equipo</th>
                        <th>Gap</th>
                        <th>Vueltas</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="liveTableBody">
                    <tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">Conectando con el flujo de datos en vivo...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Función que simula la consulta a tu API/Backend en tiempo real
        async function fetchLiveF2Data() {
            try {
                // AQUÍ APUNTARÁS TU API: 
                // Ej: const response = await fetch('https://tu-servidor-backend.com/api/f2/live');
                // const data = await response.json();

                // Simulación de datos dinámicos en vivo para mantener la magia activa:
                const liveData = [
                    { pos: 1, driver: "Z. Maloney", team: "Rodin Motorsport", gap: "Líder", laps: 14, status: "En pista" },
                    { pos: 2, driver: "P. Aron", team: "Hitech Pulse-Eight", gap: "+1.245", laps: 14, status: "En pista" },
                    { pos: 3, driver: "I. Hadjar", team: "Campos Racing", gap: "+3.890", laps: 13, status: "En pista" },
                    { pos: 4, driver: "G. Bortoleto", team: "Invicta Racing", gap: "+5.112", laps: 14, status: "En pista" }
                ];

                renderLiveTable(liveData);
            } catch (error) {
                console.error("Error al sincronizar datos en directo:", error);
            }
        }

        function renderLiveTable(drivers) {
            const tbody = document.getElementById('liveTableBody');
            tbody.innerHTML = '';

            drivers.forEach(d => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: 800; color: ${d.pos === 1 ? '#facc15' : 'inherit'}">#${d.pos}</td>
                    <td style="font-weight: 700; color: #fff;">${d.driver}</td>
                    <td style="color: var(--text-muted);">${d.team}</td>
                    <td>${d.gap}</td>
                    <td>${d.laps}</td>
                    <td><span style="color: var(--live-green); font-weight: 600;">● ${d.status}</span></td>
                `;
                tbody.appendChild(row);
            });
        }

        // Carga inicial
        fetchLiveF2Data();

        // Refresca los datos automáticamente cada 5 segundos para mantener el directo vivo
        setInterval(fetchLiveF2Data, 5000);
    </script>
</body>
</html>
