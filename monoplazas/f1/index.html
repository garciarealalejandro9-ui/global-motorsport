<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula 1 | Global Motorsport</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0b0b; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e10600; padding-bottom: 15px; margin-bottom: 20px; }
        .brand { font-size: 20px; font-weight: 900; }
        .brand span { color: #e10600; }
        .btn-back { color: #aaa; text-decoration: none; font-size: 14px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { border-left: 4px solid #e10600; padding-left: 10px; font-size: 26px; }
        select { background: #1f1f1f; color: white; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; font-size: 16px; cursor: pointer; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .tab-btn { background: none; border: none; color: #888; padding: 10px 15px; font-size: 15px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { color: #e10600; border-bottom: 2px solid #e10600; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: #151515; border: 1px solid #2a2a2a; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .podium { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .podium-item { background: #222; padding: 8px 12px; border-radius: 5px; flex: 1; min-width: 120px; font-size: 13px; }
        .podium-item strong { display: block; color: #e10600; }

        .btn-details { background: #222; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; font-size: 13px; text-align: center; }
        .details-table { display: none; margin-top: 12px; width: 100%; border-collapse: collapse; font-size: 13px; }
        .details-table th, .details-table td { border: 1px solid #333; padding: 8px; text-align: left; }
        .details-table th { background: #222; color: #e10600; }
        
        .status-msg { padding: 20px; color: #aaa; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">GLOBAL <span>MOTORSPORT</span></div>
        <a href="../../index.html" class="btn-back">← Volver</a>
    </div>

    <div class="top-bar">
        <h1 class="title">Fórmula 1</h1>
        <select id="yearSelect" onchange="loadSeasonData(this.value)"></select>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('racesTab', this)">Pruebas del Campeonato</button>
        <button class="tab-btn" onclick="switchTab('standingsTab', this)">Clasificación General</button>
    </div>

    <div id="racesTab" class="tab-content active">
        <div id="racesContainer" class="status-msg">Cargando carreras...</div>
    </div>

    <div id="standingsTab" class="tab-content">
        <div id="standingsContainer" class="status-msg">Cargando clasificación...</div>
    </div>

<script>
    // Rellenar selector de años (2026 hasta 1950)
    const select = document.getElementById("yearSelect");
    for (let y = 2026; y >= 1950; y--) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        if (y === 2024) opt.selected = true;
        select.appendChild(opt);
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    async function loadSeasonData(year) {
        document.getElementById("racesContainer").innerHTML = '<div class="status-msg">Cargando carreras de ' + year + '...</div>';
        document.getElementById("standingsContainer").innerHTML = '<div class="status-msg">Cargando clasificación de ' + year + '...</div>';

        // 1. Obtener Carreras
        try {
            const resRaces = await fetch(`https://api.jolpi.ca/ergast/f1/${year}/results.json?limit=1000`);
            if (!resRaces.ok) throw new Error("Error HTTP " + resRaces.status);
            const dataRaces = await resRaces.json();
            const races = dataRaces?.MRData?.RaceTable?.Races || [];
            renderRaces(races);
        } catch (e) {
            console.error("Error al cargar carreras:", e);
            document.getElementById("racesContainer").innerHTML = '<div class="status-msg">No se pudieron cargar los resultados de este año. Por favor, intenta seleccionar otro año.</div>';
        }

        // 2. Obtener Clasificación (Atención: driverStandings lleva la S mayúscula)
        try {
            const resStandings = await fetch(`https://api.jolpi.ca/ergast/f1/${year}/driverStandings.json`);
            if (!resStandings.ok) throw new Error("Error HTTP " + resStandings.status);
            const dataStandings = await resStandings.json();
            const standingsLists = dataStandings?.MRData?.StandingsTable?.StandingsLists || [];
            const standings = standingsLists.length > 0 ? standingsLists[0].DriverStandings : [];
            renderStandings(standings);
        } catch (e) {
            console.error("Error al cargar clasificación:", e);
            document.getElementById("standingsContainer").innerHTML = '<div class="status-msg">Clasificación no disponible para esta temporada.</div>';
        }
    }

    function renderRaces(races) {
        const container = document.getElementById("racesContainer");
        if (!races || races.length === 0) {
            container.innerHTML = '<div class="status-msg">No hay resultados o carreras registradas para el año seleccionado.</div>';
            return;
        }
        
        container.innerHTML = "";
        races.forEach((race, index) => {
            const results = race.Results || [];
            const p1 = results[0] ? `${results[0].Driver.givenName} ${results[0].Driver.familyName}` : "-";
            const p2 = results[1] ? `${results[1].Driver.givenName} ${results[1].Driver.familyName}` : "-";
            const p3 = results[2] ? `${results[2].Driver.givenName} ${results[2].Driver.familyName}` : "-";

            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <div class="card-header">
                    <h3 style="font-size:18px; color:#fff;">GP ${race.raceName}</h3>
                    <span style="color:#aaa; font-size:13px;">${race.date}</span>
                </div>
                <p style="color:#888; font-size:13px; margin-top:4px;">Circuito: ${race.Circuit?.circuitName || 'Por confirmar'}</p>
                
                <div class="podium">
                    <div class="podium-item"><strong>🥇 1º Puesto</strong>${p1}</div>
                    <div class="podium-item"><strong>🥈 2º Puesto</strong>${p2}</div>
                    <div class="podium-item"><strong>🥉 3º Puesto</strong>${p3}</div>
                </div>

                <button class="btn-details" onclick="toggleDetails(${index})">Ver resultado completo ▾</button>
                
                <table class="details-table" id="details-${index}">
                    <thead>
                        <tr><th>Pos</th><th>Piloto</th><th>Escudería</th><th>Puntos</th></tr>
                    </thead>
                    <tbody>
                        ${results.map(r => `
                            <tr>
                                <td>${r.position}</td>
                                <td>${r.Driver.givenName} ${r.Driver.familyName}</td>
                                <td>${r.Constructor ? r.Constructor.name : '-'}</td>
                                <td>${r.points}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            container.appendChild(card);
        });
    }

    function toggleDetails(index) {
        const table = document.getElementById(`details-${index}`);
        if (table) {
            table.style.display = (table.style.display === "table") ? "none" : "table";
        }
    }

    function renderStandings(standings) {
        const container = document.getElementById("standingsContainer");
        if (!standings || standings.length === 0) {
            container.innerHTML = '<div class="status-msg">Clasificación no disponible para la temporada seleccionada.</div>';
            return;
        }

        container.innerHTML = `
            <table class="details-table" style="display:table;">
                <thead>
                    <tr><th>Pos</th><th>Piloto</th><th>Escudería</th><th>Puntos</th></tr>
                </thead>
                <tbody>
                    ${standings.map(s => `
                        <tr>
                            <td><strong>${s.position}</strong></td>
                            <td>${s.Driver.givenName} ${s.Driver.familyName}</td>
                            <td>${s.Constructors && s.Constructors[0] ? s.Constructors[0].name : '-'}</td>
                            <td><strong>${s.points}</strong></td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    // Carga inicial
    loadSeasonData(2024);
</script>
</body>
</html>
