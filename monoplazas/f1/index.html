<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fórmula 1 | Global Motorsport</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0b0b; color: #ffffff; font-family: system-ui, sans-serif; padding: 16px; }

    /* Encabezado */
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #1a1a1a; margin-bottom: 20px; }
    .brand { font-weight: 900; color: #fff; text-decoration: none; }
    .brand span { color: #e10600; }
    .btn-back { color: #aaa; text-decoration: none; font-size: 0.9rem; }

    .main-container { max-width: 600px; margin: 0 auto; }

    /* Titulo y Selector de Temporadas */
    .title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-left: 4px solid #e10600; padding-left: 10px; }
    .title-bar h1 { font-size: 1.5rem; font-weight: 800; }
    .season-select { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 8px 12px; border-radius: 6px; font-weight: 700; outline: none; }

    .section-label { font-size: 0.85rem; text-transform: uppercase; color: #777; margin: 24px 0 12px 0; font-weight: 700; }

    /* Tarjetas de Pruebas */
    .race-list { display: flex; flex-direction: column; gap: 10px; }
    .race-item { background: #141414; border: 1px solid #1f1f1f; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: #fff; }
    .race-item:active { background: #1a1a1a; }
    
    .race-info { display: flex; align-items: center; gap: 12px; }
    .flag-box { 
      width: 32px; 
      height: 22px; 
      background: #222; 
      border-radius: 6px; 
      border: 1px solid #333; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 0.85rem; 
      overflow: hidden; 
      flex-shrink: 0;
    }
    
    .race-details { display: flex; flex-direction: column; }
    .race-name { font-weight: 700; font-size: 0.95rem; }
    .race-podium { font-size: 0.75rem; color: #aaa; margin-top: 4px; }

    /* Tabla de Clasificación */
    .table-container { background: #141414; border: 1px solid #1f1f1f; border-radius: 8px; overflow-x: auto; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; white-space: nowrap; }
    th { background: #1a1a1a; color: #777; padding: 10px 12px; text-transform: uppercase; font-size: 0.75rem; }
    td { padding: 12px; border-bottom: 1px solid #1f1f1f; }
    td a { color: #fff; text-decoration: none; font-weight: 700; }
    td a:hover { color: #e10600; }
    .pos { font-weight: 800; color: #e10600; text-align: center; width: 30px; }
    .pts { font-weight: 800; text-align: right; color: #fff; }
    .subtext { color: #777; font-size: 0.75rem; font-weight: normal; }
  </style>
</head>
<body>

  <header class="header">
    <a href="../../" class="brand">GLOBAL <span>MOTORSPORT</span></a>
    <a href="../" class="btn-back">← Monoplazas</a>
  </header>

  <main class="main-container">

    <!-- Selector de Temporada -->
    <div class="title-bar">
      <h1>Fórmula 1</h1>
      <select class="season-select" id="seasonSelect" onchange="cargarTemporada(this.value)">
        <!-- Se generan o leen dinámicamente -->
        <option value="2026" selected>2026</option>
        <option value="2025">2025</option>
      </select>
    </div>

    <!-- Contenedor dinámico de Pruebas -->
    <div class="section-label">Pruebas del Campeonato</div>
    <div class="race-list" id="raceList">
      <!-- JavaScript insertará las pruebas aquí -->
    </div>

    <!-- Contenedor dinámico de la Clasificación General -->
    <div class="section-label">Clasificación General</div>
    <div class="table-container">
      <table id="standingsTable">
        <!-- JavaScript insertará la tabla aquí -->
      </table>
    </div>

  </main>

  <script>
    // Función para leer el JSON y pintar los datos
    async function cargarTemporada(year) {
      try {
        const response = await fetch('./f1-data.json');
        const data = await response.json();
        const seasonData = data[year];

        if (!seasonData) return;

        // 1. Renderizar Pruebas
        const raceListEl = document.getElementById('raceList');
        raceListEl.innerHTML = seasonData.carreras.map(carrera => `
          <a href="../carrera.html?id=${carrera.id}" class="race-item">
            <div class="race-info">
              <div class="flag-box">${carrera.bandera}</div>
              <div class="race-details">
                <div class="race-name">${carrera.nombre}</div>
                <div class="race-podium">🥇 ${carrera.podio[1]} | 🥈 ${carrera.podio[2]} | 🥉 ${carrera.podio[3]}</div>
              </div>
            </div>
            <span style="color: #e10600; font-weight: 700;">Ver →</span>
          </a>
        `).join('');

        // 2. Renderizar Tabla de Clasificación
        const tableEl = document.getElementById('standingsTable');
        
        // Cabecera con las siglas de cada carrera
        const carrerasSiglas = seasonData.carreras.map(c => `<th style="text-align: center;">${c.sigla}</th>`).join('');
        let tableHeader = `
          <thead>
            <tr>
              <th style="text-align: center;">Pos</th>
              <th>Piloto / Equipo</th>
              ${carrerasSiglas}
              <th style="text-align: right;">Pts</th>
            </tr>
          </thead>
        `;

        // Filas de los pilotos
        let tableBody = seasonData.clasificacion_pilotos.map(p => {
          const puntosPorCarrera = seasonData.carreras.map(c => `
            <td style="text-align: center; color: #aaa;">${p.puntos_por_carrera[c.sigla] ?? '-'}</td>
          `).join('');

          return `
            <tr>
              <td class="pos">${p.pos}</td>
              <td>
                <a href="../piloto.html?id=${p.id_piloto}">${p.nombre}</a>
                <div class="subtext">${p.equipo}</div>
              </td>
              ${puntosPorCarrera}
              <td class="pts">${p.puntos_totales}</td>
            </tr>
          `;
        }).join('');

        tableEl.innerHTML = tableHeader + '<tbody>' + tableBody + '</tbody>';

      } catch (error) {
        console.error('Error cargando los datos:', error);
      }
    }

    // Cargar temporada inicial al entrar a la página
    document.addEventListener('DOMContentLoaded', () => cargarTemporada('2026'));
  </script>

</body>
</html>
