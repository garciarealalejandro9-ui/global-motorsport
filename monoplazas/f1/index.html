<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula 1 - Hub Histórico y Resultados | Global Motorsport</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0b0b; 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #e10600; 
            padding-bottom: 16px; 
            margin-bottom: 24px; 
        }
        .brand { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
        .brand span { color: #e10600; }
        .btn-back { 
            color: #888; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 600; 
            transition: color 0.2s;
        }
        .btn-back:hover { color: #fff; }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            background: #141414;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #262626;
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 200px;
        }

        .select-group label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.5px;
        }

        select {
            background: #1f1f1f;
            color: white;
            border: 1px solid #333;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        select:focus { border-color: #e10600; }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 20px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            border-left: 3px solid #e10600;
            padding-left: 10px;
            color: #f0f0f0;
        }

        .race-list, .standings-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .race-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .race-card:hover {
            border-color: #e10600;
            background: #222;
        }

        .race-info h4 { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: #fff; }
        .race-info p { font-size: 12px; color: #888; }

        .btn-result {
            background: #e10600;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-result:hover { background: #ff1e16; }

        .standing-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
            font-size: 13px;
        }
        .standing-pos { font-weight: 900; color: #e10600; width: 24px; }
        .standing-name { flex: 1; font-weight: 600; margin-left: 8px; }
        .standing-pts { font-weight: 700; color: #aaa; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: #141414;
            border: 1px solid #333;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 16px; right: 20px;
            font-size: 22px;
            color: #888;
            cursor: pointer;
            font-weight: 700;
        }
        .close-modal:hover { color: #fff; }
        
        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 13px;
        }
        .result-table th, .result-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #222;
        }
        .result-table th { color: #888; font-size: 11px; text-transform: uppercase; }
        .loading { text-align: center; color: #777; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">FÓRMULA 1 <span>HUB</span></div>
        <a href="../index.html" class="btn-back">← Volver a Monoplazas</a>
    </div>

    <div class="controls">
        <div class="select-group">
            <label for="yearSelect">Temporada</label>
            <select id="yearSelect">
                <!-- Se inyecta dinámicamente -->
            </select>
        </div>
    </div>

    <div class="content-grid">
        <div class="panel">
            <h2 class="panel-title" id="calendarTitle">Calendario de Grandes Premios</h2>
            <div id="calendarContainer" class="race-list">
                <div class="loading">Cargando calendario...</div>
            </div>
        </div>

        <div class="panel">
            <h2 class="panel-title">Mundial de Pilotos</h2>
            <div id="standingsContainer" class="standings-list">
                <div class="loading">Cargando clasificación...</div>
            </div>
        </div>
    </div>

    <!-- Modal Resultados -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" style="font-size: 18px; margin-bottom: 4px;">Resultado de Carrera</h3>
            <p id="modalSubtitle" style="font-size: 12px; color: #888; margin-bottom: 16px;"></p>
            <div id="modalBody">
                <div class="loading">Cargando resultados...</div>
            </div>
        </div>
    </div>

    <script>
        const yearSelect = document.getElementById('yearSelect');
        const calendarContainer = document.getElementById('calendarContainer');
        const standingsContainer = document.getElementById('standingsContainer');
        const calendarTitle = document.getElementById('calendarTitle');
        const resultModal = document.getElementById('resultModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const modalBody = document.getElementById('modalBody');

        // Generar años desde 1950 hasta 2027
        for (let y = 2027; y >= 1950; y--) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            if (y === 2026) opt.selected = true; // 2026 seleccionado por defecto
            yearSelect.appendChild(opt);
        }

        // Calendarios manuales basados exactamente en los registros oficiales de StatsF1
        const customCalendars = {
            2027: [
                { round: 1, raceName: "Bahrain Grand Prix", circuit: "Bahrain International Circuit", date: "2027-03-14" },
                { round: 2, raceName: "Saudi Arabian Grand Prix", circuit: "Jeddah Corniche Circuit", date: "2027-03-21" },
                { round: 3, raceName: "Australian Grand Prix", circuit: "Albert Park Circuit", date: "2027-04-04" },
                { round: 4, raceName: "Japanese Grand Prix", circuit: "Suzuka Circuit", date: "2027-04-11" },
                { round: 5, raceName: "Chinese Grand Prix", circuit: "Shanghai International Circuit", date: "2027-04-18" },
                { round: 6, raceName: "Miami Grand Prix", circuit: "Miami International Autodrome", date: "2027-05-02" },
                { round: 7, raceName: "Canadian Grand Prix", circuit: "Circuit Gilles Villeneuve", date: "2027-05-23" },
                { round: 8, raceName: "Monaco Grand Prix", circuit: "Circuit de Monaco", date: "2027-06-06" },
                { round: 9, raceName: "Portuguese Grand Prix", circuit: "Autódromo Internacional do Algarve", date: "2027-06-20" },
                { round: 10, raceName: "British Grand Prix", circuit: "Silverstone Circuit", date: "2027-07-04" },
                { round: 11, raceName: "Austrian Grand Prix", circuit: "Red Bull Ring", date: "2027-07-11" },
                { round: 12, raceName: "Belgian Grand Prix", circuit: "Circuit de Spa-Francorchamps", date: "2027-07-25" },
                { round: 13, raceName: "Hungarian Grand Prix", circuit: "Hungaroring", date: "2027-08-01" },
                { round: 14, raceName: "Italian Grand Prix", circuit: "Autodromo Nazionale di Monza", date: "2027-09-05" },
                { round: 15, raceName: "Spanish Grand Prix", circuit: "Madrid Circuit", date: "2027-09-12" },
                { round: 16, raceName: "Azerbaijan Grand Prix", circuit: "Baku City Circuit", date: "2027-09-26" },
                { round: 17, raceName: "Turkish Grand Prix", circuit: "Istanbul Park", date: "2027-10-03" },
                { round: 18, raceName: "Singapore Grand Prix", circuit: "Marina Bay Street Circuit", date: "2027-10-10" },
                { round: 19, raceName: "United States Grand Prix", circuit: "Circuit of the Americas", date: "2027-10-24" },
                { round: 20, raceName: "Mexico City Grand Prix", circuit: "Autódromo Hermanos Rodríguez", date: "2027-10-31" },
                { round: 21, raceName: "São Paulo Grand Prix", circuit: "Autódromo José Carlos Pace", date: "2027-11-07" },
                { round: 22, raceName: "Las Vegas Grand Prix", circuit: "Las Vegas Strip Circuit", date: "2027-11-21" },
                { round: 23, raceName: "Qatar Grand Prix", circuit: "Lusail International Circuit", date: "2027-12-05" },
                { round: 24, raceName: "Abu Dhabi Grand Prix", circuit: "Yas Marina Circuit", date: "2027-12-12" }
            ],
            2026: [
                { round: 1, raceName: "Australian Grand Prix", circuit: "Albert Park Circuit", date: "2026-03-08" },
                { round: 2, raceName: "Chinese Grand Prix", circuit: "Shanghai International Circuit", date: "2026-03-15" },
                { round: 3, raceName: "Japanese Grand Prix", circuit: "Suzuka Circuit", date: "2026-03-29" },
                { round: 4, raceName: "Miami Grand Prix", circuit: "Miami International Autodrome", date: "2026-05-03" },
                { round: 5, raceName: "Canadian Grand Prix", circuit: "Circuit Gilles Villeneuve", date: "2026-05-24" },
                { round: 6, raceName: "Monaco Grand Prix", circuit: "Circuit de Monaco", date: "2026-06-07" },
                { round: 7, raceName: "Spanish Grand Prix", circuit: "Circuit de Barcelona-Catalunya", date: "2026-06-14" },
                { round: 8, raceName: "Austrian Grand Prix", circuit: "Red Bull Ring", date: "2026-06-28" },
                { round: 9, raceName: "British Grand Prix", circuit: "Silverstone Circuit", date: "2026-07-05" },
                { round: 10, raceName: "Belgian Grand Prix", circuit: "Circuit de Spa-Francorchamps", date: "2026-07-19" },
                { round: 11, raceName: "Hungarian Grand Prix", circuit: "Hungaroring", date: "2026-07-26" },
                { round: 12, raceName: "Dutch Grand Prix", circuit: "Circuit Zandvoort", date: "2026-08-23" },
                { round: 13, raceName: "Italian Grand Prix", circuit: "Autodromo Nazionale di Monza", date: "2026-09-06" },
                { round: 14, raceName: "Spanish Grand Prix (Alternative)", circuit: "Madrid Circuit", date: "2026-09-13" },
                { round: 15, raceName: "Azerbaijan Grand Prix", circuit: "Baku City Circuit", date: "2026-09-26" },
                { round: 16, raceName: "Bahrain Grand Prix", circuit: "Bahrain International Circuit", date: "2026-10-04" },
                { round: 17, raceName: "Singapore Grand Prix", circuit: "Marina Bay Street Circuit", date: "2026-10-11" },
                { round: 18, raceName: "United States Grand Prix", circuit: "Circuit of the Americas", date: "2026-10-25" },
                { round: 19, raceName: "Mexico City Grand Prix", circuit: "Autódromo Hermanos Rodríguez", date: "2026-11-01" },
                { round: 20, raceName: "São Paulo Grand Prix", circuit: "Autódromo José Carlos Pace", date: "2026-11-08" },
                { round: 21, raceName: "Las Vegas Grand Prix", circuit: "Las Vegas Strip Circuit", date: "2026-11-21" },
                { round: 22, raceName: "Qatar Grand Prix", circuit: "Lusail International Circuit", date: "2026-11-29" },
                { round: 23, raceName: "Abu Dhabi Grand Prix", circuit: "Yas Marina Circuit", date: "2026-12-06" }
            ]
        };

        async function loadSeasonData(year) {
            calendarTitle.textContent = `Calendario ${year}`;
            calendarContainer.innerHTML = '<div class="loading">Cargando carreras...</div>';
            standingsContainer.innerHTML = '<div class="loading">Cargando mundial...</div>';

            let races = [];
            if (customCalendars[year]) {
                races = customCalendars[year];
            } else {
                try {
                    const res = await fetch(`https://api.jolpi.ca/ergast/f1/${year}.json`);
                    const data = await res.json();
                    races = data.MRData.RaceTable.Races;
                } catch (e) {
                    calendarContainer.innerHTML = '<div class="loading" style="color:#e10600;">Error al conectar con la API.</div>';
                    return;
                }
            }

            renderCalendar(year, races);
            loadStandings(year);
        }

        function renderCalendar(year, races) {
            calendarContainer.innerHTML = '';
            races.forEach(race => {
                const card = document.createElement('div');
                card.className = 'race-card';
                card.innerHTML = `
                    <div class="race-info">
                        <h4>Ronda ${race.round}: ${race.raceName}</h4>
                        <p>${race.Circuit ? race.Circuit.circuitName : race.circuit} • ${race.date}</p>
                    </div>
                    <button class="btn-result" onclick="fetchResults(${year}, ${race.round}, '${race.raceName}')">Resultados</button>
                `;
                calendarContainer.appendChild(card);
            });
        }

        async function loadStandings(year) {
            try {
                const res = await fetch(`https://api.jolpi.ca/ergast/f1/${year}/driverStandings.json`);
                const data = await res.json();
                const list = data.MRData.StandingsTable.StandingsLists[0];
                
                standingsContainer.innerHTML = '';
                if (!list || !list.DriverStandings || list.DriverStandings.length === 0) {
                    standingsContainer.innerHTML = '<div class="loading">Sin datos de clasificación para este año.</div>';
                    return;
                }

                list.DriverStandings.forEach(st => {
                    const item = document.createElement('div');
                    item.className = 'standing-item';
                    item.innerHTML = `
                        <span class="standing-pos">${st.position}</span>
                        <span class="standing-name">${st.Driver.givenName} ${st.Driver.familyName} <small style="color:#666;">(${st.Constructors[0].name})</small></span>
                        <span class="standing-pts">${st.points} pts</span>
                    `;
                    standingsContainer.appendChild(item);
                });
            } catch (e) {
                standingsContainer.innerHTML = '<div class="loading">No disponible</div>';
            }
        }

        async function fetchResults(year, round, raceName) {
            resultModal.style.display = 'flex';
            modalTitle.textContent = raceName;
            modalSubtitle.textContent = `Temporada ${year} • Ronda ${round}`;
            modalBody.innerHTML = '<div class="loading">Cargando resultados oficiales...</div>';

            try {
                const res = await fetch(`https://api.jolpi.ca/ergast/f1/${year}/${round}/results.json`);
                const data = await res.json();
                const race = data.MRData.RaceTable.Races[0];

                if (!race || !race.Results || race.Results.length === 0) {
                    modalBody.innerHTML = '<div class="loading">Los resultados de este Gran Premio aún no están disponibles o la temporada es futura.</div>';
                    return;
                }

                let html = `
                    <table class="result-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Piloto</th>
                                <th>Escudería</th>
                                <th>Tiempo / Estado</th>
                                <th>Pts</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                race.Results.forEach(r => {
                    html += `
                        <tr>
                            <td><strong>${r.position}</strong></td>
                            <td>${r.Driver.givenName} ${r.Driver.familyName}</td>
                            <td style="color:#aaa;">${r.Constructor.name}</td>
                            <td>${r.Time ? r.Time.time : r.status}</td>
                            <td><strong>${r.points}</strong></td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                modalBody.innerHTML = html;
            } catch (e) {
                modalBody.innerHTML = '<div class="loading" style="color:#e10600;">Error al obtener los resultados.</div>';
            }
        }

        function closeModal() {
            resultModal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == resultModal) closeModal();
        }

        yearSelect.addEventListener('change', (e) => {
            loadSeasonData(parseInt(e.target.value));
        });

        loadSeasonData(2026);
    </script>
</body>
</html>
