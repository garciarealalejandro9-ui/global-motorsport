<!DOCTYPE html>
<html lang="es">
<head>
    <script src="../../js/flags.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula 1 - Hub Oficial | Global Motorsport</title>
    <style>
        :root {
            --f1-red: #e10600;
            --f1-red-glow: rgba(225, 6, 0, 0.3);
            --bg-deep: #050505;
            --bg-panel: #111113;
            --bg-card: #18181b;
            --bg-card-hover: #222226;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--f1-red); 
            padding-bottom: 16px; 
            margin-bottom: 24px; 
            background: linear-gradient(180deg, rgba(225,6,0,0.05) 0%, transparent 100%);
            padding-left: 10px;
            padding-right: 10px;
        }
        .brand { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; text-transform: uppercase; }
        .brand span { color: var(--f1-red); text-shadow: 0 0 15px var(--f1-red-glow); }
        .btn-back { 
            color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; 
            background: var(--bg-card); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px;
            transition: all 0.2s ease;
        }
        .btn-back:hover { color: #fff; border-color: var(--f1-red); background: var(--bg-card-hover); }
        .controls {
            display: flex; gap: 16px; margin-bottom: 24px; background: var(--bg-panel);
            padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .select-group { display: flex; flex-direction: column; gap: 6px; flex: 1; max-width: 250px; }
        .select-group label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        select {
            background: var(--bg-deep); color: white; border: 1px solid var(--border-color);
            padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; outline: none; cursor: pointer;
        }
        select:focus { border-color: var(--f1-red); box-shadow: 0 0 0 3px var(--f1-red-glow); }
        .content-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 24px; }
        @media (max-width: 1024px) { .content-grid { grid-template-columns: 1fr; } }
        .panel {
            background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); overflow: hidden;
        }
        .panel-title {
            font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 16px; border-left: 4px solid var(--f1-red); padding-left: 10px; color: #fff;
        }
        .race-list { display: flex; flex-direction: column; gap: 12px; max-height: 650px; overflow-y: auto; padding-right: 4px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        .race-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px;
            padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: all 0.2s ease;
        }
        .race-card:hover { border-color: rgba(225, 6, 0, 0.5); background: var(--bg-card-hover); }
        .race-main-row { display: flex; justify-content: space-between; align-items: center; }
        .race-left { display: flex; align-items: center; gap: 12px; }
        .race-flag { font-size: 26px; line-height: 1; }
        .race-info h4 { font-size: 13px; font-weight: 700; margin-bottom: 2px; color: #fff; }
        .race-info p { font-size: 11px; color: var(--text-muted); }
        .btn-result {
            background: var(--f1-red); color: white; border: none; padding: 6px 12px; border-radius: 6px;
            font-size: 11px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(225,6,0,0.2); white-space: nowrap;
        }
        .race-podium {
            display: flex; gap: 8px; background: var(--bg-deep); padding: 6px 10px; border-radius: 6px;
            font-size: 11px; border: 1px solid var(--border-color); align-items: center;
        }
        .podium-item { display: flex; align-items: center; gap: 4px; color: var(--text-muted); white-space: nowrap; }
        .podium-pos { font-weight: 800; }
        .pos-1 { color: #facc15; } .pos-2 { color: #e4e4e7; } .pos-3 { color: #fb923c; }
        .table-container { width: 100%; overflow-x: auto; max-height: 650px; overflow-y: auto; }
        .matrix-table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
        .matrix-table th, .matrix-table td { padding: 8px 6px; text-align: center; border: 1px solid var(--border-color); }
        .matrix-table th {
            background: var(--bg-deep); color: var(--text-muted); font-size: 10px; text-transform: uppercase;
            position: sticky; top: 0; z-index: 10;
        }
        .matrix-table td.driver-col { text-align: left; position: sticky; left: 0; background: var(--bg-card); z-index: 5; }
        .matrix-table th.driver-header { position: sticky; left: 0; z-index: 15; background: var(--bg-deep); }
        .driver-cell-info { display: flex; align-items: center; gap: 6px; }
        .driver-flag { font-size: 14px; }
        .driver-details { display: flex; flex-direction: column; }
        .driver-name { font-weight: 700; color: #fff; font-size: 12px; }
        .driver-team { font-size: 10px; color: var(--text-muted); }
        .res-cell { font-weight: 700; font-size: 11px; }
        .res-1 { background: rgba(250, 204, 21, 0.2); color: #facc15; }
        .res-2 { background: rgba(228, 228, 231, 0.2); color: #e4e4e7; }
        .res-3 { background: rgba(251, 146, 60, 0.2); color: #fb923c; }
        .res-points { font-weight: 900; background: var(--bg-deep); color: #fff; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px;
            width: 100%; max-width: 650px; max-height: 85vh; overflow-y: auto; padding: 24px; position: relative;
        }
        .close-modal { position: absolute; top: 18px; right: 20px; font-size: 22px; color: var(--text-muted); cursor: pointer; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 12px; }
        .result-table th, .result-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .result-table th { color: var(--text-muted); font-size: 10px; text-transform: uppercase; background: var(--bg-deep); }
        .loading { text-align: center; color: var(--text-muted); padding: 30px; font-style: italic; font-size: 13px; }
        .country-flag-img { width: 22px; height: 15px; object-fit: cover; border-radius: 3px; border: 1px solid rgba(255, 255, 255, 0.2); vertical-align: middle; }
        .flag-fallback { font-size: 14px; vertical-align: middle; }
    </style>

        async function loadSeasonData(year) {
            calendarTitle.textContent = `Calendario ${year}`;
            calendarContainer.innerHTML = '<div class="loading">Cargando carreras...</div>';
            standingsContainer.innerHTML = '<div class="loading">Cargando matriz del campeonato...</div>';
            let races = [];
            
            if (customCalendars[year]) {
                races = customCalendars[year];
            } else {
                try {
                    const res = await fetch(`https://api.jolpi.ca/ergast/f1/${year}.json`);
                    if (!res.ok) throw new Error("API no disponible");
                    const data = await res.json();
                    if (data.MRData && data.MRData.RaceTable && data.MRData.RaceTable.Races) {
                        races = data.MRData.RaceTable.Races;
                    }
                    if (!races || races.length === 0) throw new Error("Sin carreras");
                } catch (e) {
                    calendarContainer.innerHTML = `<div class="loading" style="color:var(--text-muted);">No se pudieron cargar los datos de la temporada ${year} desde el servidor externo.</div>`;
                    standingsContainer.innerHTML = '<div class="loading">Sin datos de clasificación disponibles.</div>';
                    return;
                }
            }
            renderCalendar(year, races);
            loadMatrixStandings(year, races);
        }

        async function renderCalendar(year, races) {
            calendarContainer.innerHTML = '';
            for (let race of races) {
                const circuitName = race.Circuit ? race.Circuit.circuitName : race.circuit;
                const flag = getFlagHTML(race.raceName, circuitName);
                const card = document.createElement('div');
                card.className = 'race-card';
                card.id = `race-card-${year}-${race.round}`;
                card.innerHTML = `
                    <div class="race-main-row">
                        <div class="race-left">
                            <span class="race-flag">${flag}</span>
                            <div class="race-info">
                                <h4>Ronda ${race.round}: ${race.raceName}</h4>
                                <p>${circuitName} • ${race.date}</p>
                            </div>
                        </div>
                        <button class="btn-result" onclick="fetchResults(${year}, ${race.round}, '${race.raceName}')">Resultados</button>
                    </div>
                    <div id="podium-${year}-${race.round}"></div>
                `;
                calendarContainer.appendChild(card);
                if (year < 2026) fetchMiniPodium(year, race.round);
            }
        }

        async function fetchMiniPodium(year, round) {
            try {
                const res = await fetch(`https://api.jolpi.ca/ergast/f1/${year}/${round}/results.json`);
                if (!res.ok) return;
                const data = await res.json();
                const race = data.MRData.RaceTable.Races[0];
                if (race && race.Results && race.Results.length >= 3) {
                    const p1 = race.Results[0].Driver.familyName;
                    const p2 = race.Results[1].Driver.familyName;
                    const p3 = race.Results[2].Driver.familyName;
                    const container = document.getElementById(`podium-${year}-${round}`);
                    if (container) {
                        container.className = 'race-podium';
                        container.innerHTML = `
                            <div class="podium-item"><span class="podium-pos pos-1">1º</span> ${p1}</div>
                            <div class="podium-item"><span class="podium-pos pos-2">2º</span> ${p2}</div>
                            <div class="podium-item"><span class="podium-pos pos-3">3º</span> ${p3}</div>
                        `;
                    }
                }
            } catch (e) {}
        }

        async function loadMatrixStandings(year, races) {
            if (year >= 2026) {
                standingsContainer.innerHTML = '<div class="loading">La matriz de clasificación de esta temporada se habilitará cuando comiencen las rondas oficiales.</div>';
                return;
            }
            try {
                const standingsRes = await fetch(`https://api.jolpi.ca/ergast/f1/${year}/driverStandings.json`);
                if (!standingsRes.ok) throw new Error("Error API");
                const standingsData = await standingsRes.json();
                const standingsList = standingsData.MRData.StandingsTable.StandingsLists[0];
                if (!standingsList || !standingsList.DriverStandings || standingsList.DriverStandings.length === 0) {
                    standingsContainer.innerHTML = '<div class="loading">Sin datos de clasificación para este año.</div>';
                    return;
                }
                const driversMap = {};
                standingsList.DriverStandings.forEach(st => {
                    driversMap[st.Driver.driverId] = {
                        position: st.position,
                        code: st.Driver.code || st.Driver.familyName.substring(0,3).toUpperCase(),
                        name: `${st.Driver.givenName} ${st.Driver.familyName}`,
                        nationality: st.Driver.nationality,
                        constructor: st.Constructors[0].name,
                        points: st.points,
                        results: {} 
                    };
                });

                // Bucle con retraso de 80ms entre cada petición para evitar bloqueos del servidor externo
                for (let i = 0; i < races.length; i++) {
                    const race = races[i];
                    await new Promise(resolve => setTimeout(resolve, i * 80));
                    try {
                        const rRes = await fetch(`https://api.jolpi.ca/ergast/f1/${year}/${race.round}/results.json`);
                        if (rRes.ok) {
                            const rData = await rRes.json();
                            const rRace = rData.MRData.RaceTable.Races[0];
                            if (rRace && rRace.Results) {
                                rRace.Results.forEach(res => {
                                    if (driversMap[res.Driver.driverId]) {
                                        driversMap[res.Driver.driverId].results[race.round] = res.position;
                                    }
                                });
                            }
                        }
                    } catch (e) {}
                }

                let html = `<table class="matrix-table"><thead><tr><th class="driver-header">Pos / Piloto</th>`;
                races.forEach(r => {
                    const flag = getFlagHTML(r.raceName, r.Circuit ? r.Circuit.circuitName : r.circuit);
                    html += `<th><span title="${r.raceName}">${flag}</span></th>`;
                });
                html += `<th>Pts</th></tr></thead><tbody>`;

                const sortedDrivers = Object.values(driversMap).sort((a, b) => parseInt(a.position) - parseInt(b.position));
                sortedDrivers.forEach(d => {
                    const flag = getDriverFlagHTML(d.nationality);
                    html += `
                        <tr>
                            <td class="driver-col">
                                <div class="driver-cell-info">
                                    <span style="font-weight:900; width:18px; color:var(--f1-red); font-size:11px;">${d.position}</span>
                                    <span class="driver-flag">${flag}</span>
                                    <div class="driver-details">
                                        <span class="driver-name">${d.name}</span>
                                        <span class="driver-team">${d.constructor}</span>
                                    </div>
                                </div>
                            </td>
                    `;
                    races.forEach(r => {
                        const pos = d.results[r.round];
                        let posClass = "";
                        if (pos === "1") posClass = "res-1";
                        else if (pos === "2") posClass = "res-2";
                        else if (pos === "3") posClass = "res-3";
                        html += `<td class="res-cell ${posClass}">${pos ? pos : '-'}</td>`;
                    });
                    html += `<td class="res-points">${d.points}</td></tr>`;
                });
                html += `</tbody></table>`;
                standingsContainer.innerHTML = html;
            } catch (e) {
                standingsContainer.innerHTML = '<div class="loading" style="color:var(--text-muted);">No se pudo cargar la matriz de clasificación debido a restricciones del servidor externo.</div>';
            }
        }

        async function fetchResults(year, round, raceName) {
            resultModal.style.display = 'flex';
            modalTitle.textContent = raceName;
            modalSubtitle.textContent = `Temporada ${year} • Ronda ${round}`;
            if (year >= 2026) {
                modalBody.innerHTML = '<div class="loading">Los resultados para esta temporada aún no están disponibles.</div>';
                return;
            }
            modalBody.innerHTML = '<div class="loading">Cargando resultados oficiales...</div>';
            try {
                const res = await fetch(`https://api.jolpi.ca/ergast/f1/${year}/${round}/results.json`);
                if (!res.ok) throw new Error("Error API");
                const data = await res.json();
                const race = data.MRData.RaceTable.Races[0];
                if (!race || !race.Results || race.Results.length === 0) {
                    modalBody.innerHTML = '<div class="loading">Los resultados aún no están disponibles.</div>';
                    return;
                }
                let html = `<table class="result-table"><thead><tr><th>Pos</th><th>Piloto</th><th>Escudería</th><th>Tiempo / Estado</th><th>Pts</th></tr></thead><tbody>`;
                race.Results.forEach(r => {
                    html += `<tr><td><strong>${r.position}</strong></td><td>${getDriverFlagHTML(r.Driver.nationality)} ${r.Driver.givenName} ${r.Driver.familyName}</td><td style="color:var(--text-muted);">${r.Constructor.name}</td><td>${r.Time ? r.Time.time : r.status}</td><td><strong>${r.points}</strong></td></tr>`;
                });
                html += `</tbody></table>`;
                modalBody.innerHTML = html;
            } catch (e) {
                modalBody.innerHTML = '<div class="loading" style="color:var(--text-muted);">No se pudieron obtener los resultados de la API.</div>';
            }
        }

        function closeModal() { resultModal.style.display = 'none'; }
        window.onclick = function(event) { if (event.target == resultModal) closeModal(); }

        yearSelect.addEventListener('change', (e) => {
            const selectedYear = e.target.value;
            localStorage.setItem('f1_selected_year', selectedYear);
            loadSeasonData(parseInt(selectedYear));
        });

        const savedYear = localStorage.getItem('f1_selected_year') || "2026";
        yearSelect.value = savedYear;
        loadSeasonData(parseInt(savedYear));
    </script>
</body>
</html>
