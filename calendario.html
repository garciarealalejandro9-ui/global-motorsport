<!DOCTYPE html>
<html lang="es">
<head></head>
    <meta name="google-adsense-account" content="ca-pub-2796490265941139">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario | Global Motorsport</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

/* HEADER */
header {
    height: 70px;
    background: #111;
    border-bottom: 2px solid #d00000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: relative;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
}

.logo span {
    color: #e00000;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 18px;
}

.search {
    background: #222;
    border: 1px solid #444;
    border-radius: 20px;
    padding: 8px 14px;
    color: white;
    width: 160px;
}

.menu-button {
    font-size: 28px;
    cursor: pointer;
    user-select: none;
}

/* MENU */
.menu {
    display: none;
    position: absolute;
    right: 15px;
    top: 65px;
    width: 230px;
    background: #151515;
    border: 1px solid #444;
    z-index: 100;
}

.menu a,
.menu button {
    display: block;
    width: 100%;
    padding: 14px 16px;
    color: white;
    text-decoration: none;
    background: none;
    border: none;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
}

.menu a:hover,
.menu button:hover {
    background: #d00000;
}

.menu.show {
    display: block;
}

.languages {
    display: none;
    background: #222;
}

.languages.show {
    display: block;
}

.languages a {
    padding-left: 30px;
}

/* HERO */
.hero {
    padding: 50px 20px 35px;
    text-align: center;
    background: linear-gradient(180deg, #180000, #080808);
}

.hero h1 {
    margin: 0 0 10px;
    font-size: 38px;
}

.hero p {
    margin: 0;
    color: #aaa;
}

/* MAIN */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px 60px;
}

/* FILTERS */
.filters {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.filters select {
    background: #151515;
    color: white;
    border: 1px solid #444;
    padding: 11px 14px;
    border-radius: 6px;
    min-width: 190px;
}

/* CALENDAR TOP */
.calendar-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.calendar-title {
    font-size: 25px;
    font-weight: bold;
}

.calendar-buttons {
    display: flex;
    gap: 7px;
}

.calendar-buttons button {
    background: #222;
    color: white;
    border: 1px solid #444;
    padding: 9px 13px;
    border-radius: 5px;
    cursor: pointer;
}

.calendar-buttons button:hover {
    background: #d00000;
}

/* CALENDAR */
.calendar {
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
}

.weekdays,
.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
}

.weekday {
    background: #1c1c1c;
    padding: 13px 5px;
    text-align: center;
    font-weight: bold;
    color: #bbb;
    border-right: 1px solid #333;
    border-bottom: 1px solid #333;
}

.day {
    min-height: 115px;
    padding: 8px;
    border-right: 1px solid #292929;
    border-bottom: 1px solid #292929;
    position: relative;
}

.day-number {
    font-weight: bold;
    color: #aaa;
}

.day.today {
    background: #210000;
}

.day.today .day-number {
    color: #ff3333;
}

/* EVENTOS */
.event {
    margin-top: 7px;
    background: #d00000;
    border-radius: 4px;
    padding: 6px;
    font-size: 12px;
    line-height: 1.3;
    cursor: pointer;
}

.event:hover {
    background: #f00000;
}

.event-name {
    font-weight: bold;
}

.event-competition {
    color: #ddd;
    font-size: 11px;
}

/* SIN EVENTOS */
.no-events {
    text-align: center;
    padding: 35px 15px;
    color: #777;
}

/* FOOTER */
footer {
    background: #111;
    border-top: 1px solid #333;
    text-align: center;
    padding: 25px;
    color: #777;
    font-size: 13px;
}

/* MÓVIL */
@media (max-width: 700px) {

    header {
        padding: 0 14px;
    }

    .logo {
        font-size: 18px;
    }

    .search {
        width: 110px;
    }

    .hero h1 {
        font-size: 30px;
    }

    .calendar-top {
        flex-direction: column;
        align-items: flex-start;
    }

    .calendar {
        overflow-x: auto;
    }

    .weekdays,
    .days {
        min-width: 700px;
    }

    .day {
        min-height: 100px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        GLOBAL <span>MOTORSPORT</span>
    </div>

    <div class="header-right">

        <input
            class="search"
            type="search"
            placeholder="Buscar..."
        >

        <div
            class="menu-button"
            onclick="toggleMenu()"
        >
            ☰
        </div>

    </div>

    <div class="menu" id="menu">

        <a href="index.html">Inicio</a>

        <a href="competiciones.html">
            Competiciones
        </a>

        <a href="calendario.html">
            Calendario
        </a>

        <a href="estadisticas.html">
            Estadísticas
        </a>

        <a href="#">
            Multimedia
        </a>

        <a href="#">
            Vehículos
        </a>

        <a href="#">
            Contacto
        </a>

        <button onclick="toggleLanguages(event)">
            Idioma ▾
        </button>

        <div class="languages" id="languages">

            <a href="#">
                Español
            </a>

            <a href="#">
                English
            </a>

            <a href="#">
                Français
            </a>

            <a href="#">
                Deutsch
            </a>

        </div>

    </div>

</header>


<section class="hero">

    <h1>Calendario</h1>

    <p>
        Todas las pruebas de motorsport organizadas por fecha.
    </p>

</section>


<main class="container">

    <!-- FILTROS -->

    <div class="filters">

        <select id="categoryFilter">
            <option value="all">
                Todas las categorías
            </option>

            <option value="automovilismo">
                Automovilismo
            </option>

            <option value="motociclismo">
                Motociclismo
            </option>
        </select>


        <select id="competitionFilter">

            <option value="all">
                Todas las competiciones
            </option>

        </select>

    </div>


    <!-- CABECERA DEL CALENDARIO -->

    <div class="calendar-top">

        <div
            class="calendar-title"
            id="monthTitle">
        </div>

        <div class="calendar-buttons">

            <button onclick="previousMonth()">
                ←
            </button>

            <button onclick="goToday()">
                Hoy
            </button>

            <button onclick="nextMonth()">
                →
            </button>

        </div>

    </div>


    <!-- CALENDARIO -->

    <div class="calendar">

        <div class="weekdays">

            <div class="weekday">Lun</div>
            <div class="weekday">Mar</div>
            <div class="weekday">Mié</div>
            <div class="weekday">Jue</div>
            <div class="weekday">Vie</div>
            <div class="weekday">Sáb</div>
            <div class="weekday">Dom</div>

        </div>

        <div
            class="days"
            id="calendarDays">
        </div>

    </div>


    <div
        class="no-events"
        id="noEvents">
    </div>

</main>


<footer>

    © 2026 Global Motorsport

</footer>


<script>

/* =========================================
   FECHA ACTUAL
========================================= */

let currentDate = new Date();


/* =========================================
   EVENTOS
   POR AHORA ESTÁ VACÍO
========================================= */

let eventos = [];


/* =========================================
   NOMBRES DE LOS MESES
========================================= */

const months = [
    "Enero",
    "Febrero",
    "Marzo",
    "Abril",
    "Mayo",
    "Junio",
    "Julio",
    "Agosto",
    "Septiembre",
    "Octubre",
    "Noviembre",
    "Diciembre"
];


/* =========================================
   DIBUJAR CALENDARIO
========================================= */

function renderCalendar() {

    const year = currentDate.getFullYear();

    const month = currentDate.getMonth();

    const firstDay =
        new Date(year, month, 1);

    const lastDay =
        new Date(year, month + 1, 0);

    const daysInMonth =
        lastDay.getDate();

    let startingDay =
        firstDay.getDay();

    /*
       JavaScript empieza la semana
       en domingo.

       Lo cambiamos para que:
       lunes = 0
    */

    startingDay =
        startingDay === 0
        ? 6
        : startingDay - 1;


    document.getElementById("monthTitle").textContent =
        months[month] + " " + year;


    const calendarDays =
        document.getElementById("calendarDays");

    calendarDays.innerHTML = "";


    /* DÍAS DEL MES ANTERIOR */

    for (
        let i = 0;
        i < startingDay;
        i++
    ) {

        const emptyDay =
            document.createElement("div");

        emptyDay.className = "day";

        calendarDays.appendChild(emptyDay);

    }


    /* DÍAS DEL MES */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const dayElement =
            document.createElement("div");

        dayElement.className = "day";


        const number =
            document.createElement("div");

        number.className =
            "day-number";

        number.textContent =
            day;


        dayElement.appendChild(number);


        /* COMPROBAR SI ES HOY */

        const today =
            new Date();

        if (
            day === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
        ) {

            dayElement.classList.add("today");

        }


        /* BUSCAR EVENTOS */

        const dateString =
            year +
            "-" +
            String(month + 1).padStart(2, "0") +
            "-" +
            String(day).padStart(2, "0");


        const filteredEvents =
            eventos.filter(evento => {

                const category =
                    document.getElementById(
                        "categoryFilter"
                    ).value;

                const competition =
                    document.getElementById(
                        "competitionFilter"
                    ).value;


                if (
                    evento.fecha !== dateString
                ) {
                    return false;
                }


                if (
                    category !== "all" &&
                    evento.categoria !== category
                ) {
                    return false;
                }


                if (
                    competition !== "all" &&
                    evento.competicion !== competition
                ) {
                    return false;
                }


                return true;

            });


        /* MOSTRAR EVENTOS */

        filteredEvents.forEach(evento => {

            const eventElement =
                document.createElement("div");

            eventElement.className =
                "event";


            eventElement.innerHTML =

                '<div class="event-name">' +
                evento.nombre +
                '</div>' +

                '<div class="event-competition">' +
                evento.competicion +
                '</div>';


            dayElement.appendChild(
                eventElement
            );

        });


        calendarDays.appendChild(
            dayElement
        );

    }


    updateNoEvents();

}


/* =========================================
   COMPROBAR SI HAY EVENTOS
========================================= */

function updateNoEvents() {

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    const monthEvents =
        eventos.filter(evento => {

            const date =
                new Date(evento.fecha);

            if (
                date.getFullYear() !== year
            ) {
                return false;
            }

            if (
                date.getMonth() !== month
            ) {
                return false;
            }


            const category =
                document.getElementById(
                    "categoryFilter"
                ).value;

            const competition =
                document.getElementById(
                    "competitionFilter"
                ).value;


            if (
                category !== "all" &&
                evento.categoria !== category
            ) {
                return false;
            }


            if (
                competition !== "all" &&
                evento.competicion !== competition
            ) {
                return false;
            }


            return true;

        });


    const noEvents =
        document.getElementById(
            "noEvents"
        );


    if (monthEvents.length === 0) {

        noEvents.textContent =
            "No hay pruebas programadas para este mes.";

    } else {

        noEvents.textContent = "";

    }

}


/* =========================================
   CAMBIAR MES
========================================= */

function previousMonth() {

    currentDate.setMonth(
        currentDate.getMonth() - 1
    );

    renderCalendar();

}


function nextMonth() {

    currentDate.setMonth(
        currentDate.getMonth() + 1
    );

    renderCalendar();

}


function goToday() {

    currentDate =
        new Date();

    renderCalendar();

}


/* =========================================
   FILTROS
========================================= */

document
    .getElementById("categoryFilter")
    .addEventListener(
        "change",
        renderCalendar
    );


document
    .getElementById("competitionFilter")
    .addEventListener(
        "change",
        renderCalendar
    );


/* =========================================
   ACTUALIZAR COMPETICIONES
========================================= */

function updateCompetitionFilter() {

    const select =
        document.getElementById(
            "competitionFilter"
        );


    const currentValue =
        select.value;


    const competitions =
        [...new Set(
            eventos.map(
                evento => evento.competicion
            )
        )];


    select.innerHTML =
        '<option value="all">' +
        'Todas las competiciones' +
        '</option>';


    competitions.forEach(
        competition => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                competition;

            option.textContent =
                competition;

            select.appendChild(
                option
            );

        }
    );


    if (
        competitions.includes(
            currentValue
        )
    ) {

        select.value =
            currentValue;

    }

}


/* =========================================
   MENÚ
========================================= */

function toggleMenu() {

    document
        .getElementById("menu")
        .classList.toggle("show");

}


function toggleLanguages(event) {

    event.stopPropagation();

    document
        .getElementById("languages")
        .classList.toggle("show");

}


/* =========================================
   INICIAR
========================================= */

updateCompetitionFilter();

renderCalendar();

</script>

</body>
</html>
